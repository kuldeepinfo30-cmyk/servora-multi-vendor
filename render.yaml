# Render blueprint for the Servora API.
#
# Usage: push this repo, then in Render choose "New > Blueprint" and point it at
# the repo. Render reads this file, creates Postgres + Redis + the API, and asks
# you for the values marked `sync: false`.
#
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: servora-api
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # Set this to the Vercel URL once the front end is live.
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: servora-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: servora-redis
          property: connectionString
      # Generate each with: openssl rand -base64 48
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: COOKIE_SECURE
        value: "true"
      # Production cookies must be sent to the API's own host, not the front end's.
      - key: COOKIE_DOMAIN
        sync: false
      # Razorpay: key id is publishable, secret must stay server-side.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_CURRENCY
        value: INR
      # The React demo creates amount-first orders. Turn this off once the
      # storefront creates bookings through the API.
      - key: ENABLE_STOREFRONT_CHECKOUT
        value: "true"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DEMO_PASSWORD
        sync: false

  
  - type: keyvalue
    name: servora-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: servora-postgres
    databaseName: servora
    user: servora
    plan: free
